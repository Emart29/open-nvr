#
# Build + publish workflow for the ghcr.io/open-nvr/detect-pipeline image
# (the always-on Tier-0 detect service). docker-compose references this
# image so a normal install pulls it from GHCR instead of building the
# ffmpeg + opencv layers locally.
#
# Mirrors publish-images.yml (opennvr-core):
#   - PR touching detect-pipeline/** → run tests + build only, no push,
#     plus a container smoke that proves the import graph + ffmpeg resolve
#     inside the real /app layout (the "green tests, crashes on deploy" class).
#   - Push to any branch → build + push :<branch> and :sha-<short>.
#   - Tag v* → also :latest + semver tags. Only a release moves :latest
#     (compose defaults to it when CORE_TAG is unset); main is :main.
#   - OpenNVR Accelerate flavours: the same Dockerfile built with ACCEL=intel
#     publishes every tag again with an -intel suffix (0.2.0-intel, main-intel,
#     latest-intel), amd64 only. docker-compose.accel-intel.yml pulls it.

name: publish-detect-pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "detect-pipeline/**"
      - ".github/workflows/publish-detect-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: publish-detect-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Never publish from untested code — run the unit + real-ffmpeg suite first.
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ffmpeg so the real-ffmpeg integration tests actually run (they skip if absent).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install package + pytest
        run: pip install ./detect-pipeline pytest
      - name: Run tests
        run: cd detect-pipeline && python -m pytest -q

  build-and-push:
    name: detect-pipeline image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sigstore keyless signing (same as publish-app-images.yml): the
      # certificate names this workflow, ref and repository.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation for the arm64 build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/open-nvr/detect-pipeline
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=OpenNVR detect-pipeline
            org.opencontainers.image.description=Always-on Tier-0 detection (motion, region, detect, track) per camera. Additive consumer of MediaMTX; publishes to the OpenNVR inference event bus.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=OpenNVR

      - name: Build${{ github.event_name != 'pull_request' && ' + push' || ' (no push)' }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./detect-pipeline
          file: detect-pipeline/Dockerfile
          # Multi-arch on push, single-arch on pull_request. ``load: true``
          # imports the result into the local docker daemon, which cannot
          # hold a multi-platform image — so the PR smoke test builds
          # linux/amd64 only. Release/main builds publish a manifest list
          # covering both, which is what Apple Silicon and Raspberry Pi
          # hosts resolve against at pull time.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'ghcr.io/open-nvr/detect-pipeline:local-smoke' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=detect-pipeline
          cache-to: type=gha,scope=detect-pipeline,mode=max

      # Sign the multi-arch manifest digest (never a tag: tags move). Check with
      #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/open-nvr/' ghcr.io/open-nvr/detect-pipeline@<digest>
      # The updater trusts the signed release manifest; this is defence in depth.
      - name: Sign (Sigstore keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          cosign sign --yes "ghcr.io/open-nvr/detect-pipeline@${DIGEST}"
          echo "signed ghcr.io/open-nvr/detect-pipeline@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # Prove the container's import graph + entrypoint + ffmpeg resolve inside
      # the real /app layout (catches a module missing from COPY, or ffmpeg not
      # installed — neither of which unit tests would catch).
      - name: Smoke-test the built image (PR only)
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ghcr.io/open-nvr/detect-pipeline:local-smoke
        run: |
          set -euo pipefail
          echo "== ffmpeg present =="
          docker run --rm "$IMAGE" ffmpeg -version | head -1
          echo "== import graph + manager builds (service disabled) =="
          docker run --rm -e DETECT_PIPELINE_ENABLED=false "$IMAGE" python -c "
          import detect_pipeline.run as r, detect_pipeline.bus as b
          cfg = r.config_from_env({'DETECT_PIPELINE_ENABLED': 'false'})
          mgr = r.build_manager(cfg, b.EventSink(lambda s, d: None))
          mgr.reconcile()  # disabled -> no discovery, no workers
          assert mgr.running_ids() == set()
          print('boot-graph ok')
          "
          echo "== console entrypoint is installed =="
          docker run --rm "$IMAGE" sh -c "command -v opennvr-tier0"

  # Intel flavour: same source, ACCEL=intel (onnxruntime-openvino + Intel
  # OpenCL/NPU user-space, see detect-pipeline/scripts/install-intel-runtime.sh).
  # A separate job rather than a matrix so the required check keeps its name.
  build-and-push-intel:
    name: detect-pipeline image (intel)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/open-nvr/detect-pipeline
          flavor: |
            suffix=-intel,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=OpenNVR detect-pipeline (intel)
            org.opencontainers.image.description=Tier-0 detection, Intel flavour: VA-API decode on the iGPU, OpenVINO detector on the NPU / iGPU.
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=OpenNVR
      - name: Build${{ github.event_name != 'pull_request' && ' + push' || ' (no push)' }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./detect-pipeline
          file: detect-pipeline/Dockerfile
          # amd64 only: there are no Intel iGPUs/NPUs on arm64 and Intel ships
          # no arm64 user-space.
          platforms: linux/amd64
          build-args: |
            ACCEL=intel
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ github.event_name == 'pull_request' && 'ghcr.io/open-nvr/detect-pipeline:local-smoke-intel' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=detect-pipeline-intel
          cache-to: type=gha,scope=detect-pipeline-intel,mode=max
      - name: Sign (Sigstore keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          cosign sign --yes "ghcr.io/open-nvr/detect-pipeline@${DIGEST}"
          echo "signed ghcr.io/open-nvr/detect-pipeline@${DIGEST} (intel)" >> "$GITHUB_STEP_SUMMARY"
      # The runner has no Intel GPU, so this proves the flavour is *wired*:
      # the OpenVINO provider is present, the Intel VA/OpenCL/NPU user-space
      # is installed, and the service still boots. Device inference is the
      # benchmark harness's job on real hardware (docs/HARDWARE.md).
      - name: Smoke-test the built image (PR only)
        if: github.event_name == 'pull_request'
        env:
          IMAGE: ghcr.io/open-nvr/detect-pipeline:local-smoke-intel
        run: |
          set -euo pipefail
          echo "== Intel user-space present =="
          docker run --rm "$IMAGE" sh -c "ls /usr/lib/x86_64-linux-gnu/dri/iHD_drv_video.so && ls /etc/OpenCL/vendors/ && ls /usr/lib/x86_64-linux-gnu/libze_intel_vpu.so* && clinfo --version"
          echo "== OpenVINO execution provider available =="
          docker run --rm "$IMAGE" python -c "
          import onnxruntime as ort
          provs = ort.get_available_providers()
          assert 'OpenVINOExecutionProvider' in provs, provs
          print('providers:', provs)
          "
          echo "== device shorthand resolves against the installed runtime =="
          docker run --rm "$IMAGE" python -c "
          import onnxruntime as ort
          from detect_pipeline.onnx_detector import resolve_providers, describe_providers
          p = resolve_providers('OpenVINOExecutionProvider:AUTO:NPU,GPU,CPU', ort.get_available_providers())
          assert p[0] == ('OpenVINOExecutionProvider', {'device_type': 'AUTO:NPU,GPU,CPU'}), p
          print(describe_providers(p))
          "
          echo "== boot graph (service disabled) =="
          docker run --rm -e DETECT_PIPELINE_ENABLED=false "$IMAGE" python -c "
          import detect_pipeline.run as r, detect_pipeline.bus as b
          cfg = r.config_from_env({'DETECT_PIPELINE_ENABLED': 'false'})
          mgr = r.build_manager(cfg, b.EventSink(lambda s, d: None))
          mgr.reconcile()
          assert mgr.running_ids() == set()
          print('boot-graph ok')
          "
